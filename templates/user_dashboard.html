{% extends 'base.html' %}
{% block content %}
<div class="dashboard-wrap">
  <h2>User Dashboard</h2>

  <div class="panel">
    <h3>Ask Question</h3>
    <form method="post" action="{{ url_for('ask_question') }}">
      <label for="subject">Subject</label>
      <select id="subject" name="subject" required>
        <option value="">Select a subject</option>
        {% for subject in subjects %}
          <option value="{{ subject }}">{{ subject }}</option>
        {% endfor %}
      </select>

      <label for="question">Question</label>
      <textarea id="question" name="question" rows="5" placeholder="Ask a question about the selected subject..." required>{{ question or '' }}</textarea>

      <button type="submit">Ask</button>
    </form>
  </div>

  {% if answer %}
  <section class="panel answer-panel" aria-live="polite">
    <h3>Response</h3>
    <div class="qa-block">
      <h4>Question</h4>
      <p>{{ question }}</p>
    </div>
    <div class="qa-block">
      <h4>Answer</h4>
      <div class="answer-content">{{ answer }}</div>
    </div>
  </section>
  {% endif %}
</div>
{% endblock %}
