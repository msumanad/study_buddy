{% extends 'base.html' %}
{% block content %}
<div class="dashboard-wrap">
  <h2>User Dashboard</h2>

  <section id="conversation-history" class="conversation-history" aria-label="Conversation history" hidden>
    <h3>Conversation</h3>
    <div id="conversation-entries" aria-live="polite"></div>
  </section>

  <div class="panel" id="ask-question">
    <h3>Ask a question</h3>
    <form id="question-form" data-user-id="{{ current_user.id }}" method="post" action="{{ url_for('ask_question') }}">
      <label for="subject">Subject</label>
      <select id="subject" name="subject" required>
        <option value="">Select a subject</option>
        {% for subject in subjects %}
          <option value="{{ subject }}" {% if subject == selected_subject %}selected{% endif %}>{{ subject }}</option>
        {% endfor %}
      </select>

      <label for="question">Question</label>
      <textarea id="question" name="question" rows="5" placeholder="Ask a question about the selected subject..." required></textarea>

      <button type="submit">Ask</button>
    </form>
    <p id="question-status" role="status" aria-live="polite"></p>
  </div>
</div>
<script src="{{ url_for('static', filename='user_dashboard.js') }}" defer></script>
{% endblock %}
